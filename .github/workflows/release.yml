name: Release

# Pushing a tag like v1.1.0 builds a universal (arm64 + x86_64) UTCMenuBar.app,
# zips it, and publishes a GitHub Release with auto-generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build-and-publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: build-app.sh derives the version from `git describe`
          # and the build number from the commit count.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh

      - name: Build universal app bundle
        run: |
          chmod +x ./scripts/build-app.sh
          ./scripts/build-app.sh release --universal

      - name: Verify universal binary
        run: |
          BIN=UTCMenuBar.app/Contents/MacOS/UTCMenuBar
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64

      - name: Zip app bundle
        run: ditto -c -k --keepParent UTCMenuBar.app "UTCMenuBar-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="UTCMenuBar-${GITHUB_REF_NAME}.zip"
          SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          # Install guidance is prepended to the auto-generated notes. The
          # build is not notarized, so first launch needs Privacy & Security →
          # Open Anyway (macOS 15+ removed the right-click → Open bypass).
          NOTES=$(printf '%s\n' \
            "## 安装 / Install" \
            "" \
            "首次安装：解压后把 **UTCMenuBar.app** 拖入「应用程序」，双击打开。macOS 会拦截未公证的应用：前往 **系统设置 → 隐私与安全性**，在页面底部点击 **仍要打开 (Open Anyway)**。或在终端执行：" \
            "" \
            'First install: unzip, drag **UTCMenuBar.app** into Applications, double-click. macOS blocks unnotarized apps: go to **System Settings → Privacy & Security** and click **Open Anyway** at the bottom. Or run:' \
            "" \
            '```bash' \
            "xattr -d com.apple.quarantine /Applications/UTCMenuBar.app" \
            '```' \
            "" \
            "装好之后无需再来 GitHub：右键菜单栏时钟 → **检查更新…** 即可在应用内升级。/ After that, updates install in-app: right-click the clock → **Check for Updates…**." \
            "" \
            "**SHA-256**: \`$SHA256\`" \
            "")
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$NOTES" \
            "$ZIP"
